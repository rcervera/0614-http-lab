server {
    listen 80;
    absolute_redirect off;   # evita que es perdi el port extern de Docker a la capçalera Location

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /redirigeix {
        return 301 /index.html;
    }

    location /prohibit {
        deny all;
    }

    location /trencat {
        return 500;
    }

    location /api/echo {
        limit_except POST {
            deny all;
        }
        add_header Content-Type application/json always;
        return 200 '{"missatge": "Peticio rebuda correctament"}';
    }

    location /api/recurs {
        limit_except DELETE {
            deny all;
        }
        add_header Content-Type application/json always;
        return 200 '{"missatge": "Recurs eliminat correctament"}';
    }

    location /formulari-resultat {
        default_type text/html;
        return 200 '<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <title>Dades rebudes</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #1a2230; max-width: 480px; margin: 60px auto; padding: 0 20px; }
    h1 { color: #0d3c4d; text-align: center; }
    .card { background: #fff; border: 1px solid #dbe0e6; border-radius: 8px; padding: 24px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 8px 4px; border-bottom: 1px solid #eaeff2; }
    td:first-child { font-weight: bold; color: #57606f; width: 120px; }
    a { display: block; text-align: center; margin-top: 20px; color: #1c6e8c; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Dades rebudes</h1>
  <div class="card">
    <table>
      <tr><td>Nom</td><td>$arg_nom</td></tr>
      <tr><td>Email</td><td>$arg_email</td></tr>
      <tr><td>Missatge</td><td>$arg_missatge</td></tr>
    </table>
    <a href="/formulari.html">← Torna al formulari</a>
  </div>
</body>
</html>';
    }

    location = /formulari-post-info {
	limit_except POST {
            deny all;
        }
        default_type text/html;

        return 200 '<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <title>Formulari processat</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #1a2230; max-width: 480px; margin: 60px auto; padding: 0 20px; text-align: center; }
    h1 { color: #0d3c4d; }
    .card { background: #fff; border: 1px solid #dbe0e6; border-radius: 8px; padding: 24px; margin-top: 24px; }
    a { display: block; margin-top: 20px; color: #1c6e8c; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Formulari processat</h1>
  <div class="card">
    <p>La pàgina ha estat processada.</p>
    <p>De moment no es poden obtenir les variables enviades dins el cos de la petició HTTP.</p>
    <a href="/formulari.html">Torna al formulari</a>
  </div>
</body>
</html>';
    }

}
 
